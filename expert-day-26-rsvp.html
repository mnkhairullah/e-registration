<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0A1A3E}
body{overflow-x:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#stage{position:relative;width:100%;height:100vh;overflow:hidden;color:#fff}
.cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.scr{position:absolute;top:0;right:0;bottom:0;left:0;background:#0A1A3E linear-gradient(165deg,#0A1A3E,#16397d);background-size:100% 100%;background-position:center;background-repeat:no-repeat}
.e{position:absolute;transform:translate(-50%,-50%);margin:0;text-align:center;font-family:inherit}
button.e{border:0;cursor:pointer}
button.e:disabled{opacity:.6;cursor:not-allowed}
a.e{display:block;text-decoration:none}
input.e{text-align:left;outline:none}
input.e:focus,button.e:focus-visible,a.e:focus-visible{box-shadow:0 0 0 calc(var(--u)*.6) rgba(240,214,120,.55)}
.box small{display:block;opacity:.8;font-size:.8em;margin-bottom:.35em}
.box a{color:inherit;word-break:break-all;text-decoration:none}
.grid{position:absolute;top:0;right:0;bottom:0;left:0;z-index:9;pointer-events:none;background-image:linear-gradient(rgba(255,0,60,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,60,.45) 1px,transparent 1px);background-size:10% 10%}
</style>
</head>
<body>
<div id="stage"></div>
<noscript><p style="color:#fff;text-align:center;font:16px system-ui,sans-serif;padding:24px">Aktifkan JavaScript di browser Anda untuk mengisi RSVP.</p></noscript>

<script src="config.js"></script>
<script>
(function(){
function boot(safe){
  var A = window.APP || {}, D = safe ? {} : (A.DESIGN || {}), Q = new URLSearchParams(location.search), demo = Q.get('demo');
  var FALLBACK_API = 'https://script.google.com/macros/s/AKfycbxgeoQMZzuhvBYeS4pcfnEX15s4pMLFN-QeXy3NcMQjUXO0ZakmOWjOByNd46WbhVxTSg/exec';
  var API = /^https:\/\/script\.google\.com\/.+\/exec$/.test(A.API_URL || '') ? A.API_URL : FALLBACK_API;
  var stage = document.getElementById('stage'), DW = D.width || 1080, DH = D.height || 1920;
  stage.innerHTML = '';

  /* Tema dari config.js (sama seperti tiket) */
  document.documentElement.style.background = document.body.style.background = D.letterbox || '#0A1A3E';
  stage.style.fontFamily = D.font || 'system-ui,sans-serif';
  stage.style.color = D.color || '#fff';
  if (D.fontUrl) { var lk = document.createElement('link'); lk.rel = 'stylesheet'; lk.href = D.fontUrl; document.head.appendChild(lk); }

  /* Kanvas 1080x1920 diskalakan muat layar; --u = 1% lebar desain */
  var lastW = 0, screens = [];
  function fit(){
    var de = document.documentElement, a = document.activeElement, VW = de.clientWidth || innerWidth || window.screen.width || 360;
    if (a && a.tagName === 'INPUT' && VW === lastW) return; // keyboard Android jangan mengecilkan kanvas
    lastW = VW;
    var VH = innerHeight || de.clientHeight || window.screen.height || 640;
    stage.style.height = VH + 'px';
    screens.forEach(function(s){
      var b = s.bleed, kw = VW / DW, kh = VH / DH;
      // HP tinggi: lebar layar dipenuhi & gambar (dengan bleed) menutup tinggi layar; layar lebar: muat tinggi
      var k = kw <= kh ? Math.max(kw, VH / (DH + 2 * b)) : kh;
      s.style.setProperty('--u', (DW * k / 100) + 'px');
      s.cv.style.width = (DW * k) + 'px'; s.cv.style.height = (DH * k) + 'px';
      if (s.art) s.style.backgroundSize = (DW * k) + 'px ' + ((DH + 2 * b) * k) + 'px';
    });
  }
  var u = function(n){ return 'calc(var(--u) * ' + n + ')'; };

  /* Elemen berposisi persen: x,y = titik tengah; w = lebar; size/weight/color/font/lineHeight/letterSpacing/
     uppercase/italic/shadow/align/bg/radius/pad/border */
  function mk(sc, tag, def, over){
    if (over === false) return null;
    var c = Object.assign({}, def, over), e = document.createElement(tag), s = e.style;
    e.className = 'e';
    s.left = c.x + '%'; s.top = c.y + '%';
    if (c.w) s.width = c.w + '%';
    if (c.size) s.fontSize = tag === 'input' ? 'max(16px,' + u(c.size) + ')' : u(c.size); // 16px: cegah zoom otomatis iOS
    if (c.weight) s.fontWeight = c.weight;
    if (c.color) s.color = c.color;
    if (c.font) s.fontFamily = c.font;
    if (c.lineHeight) s.lineHeight = c.lineHeight;
    if (c.letterSpacing) s.letterSpacing = u(c.letterSpacing);
    if (c.uppercase) s.textTransform = 'uppercase';
    if (c.italic) s.fontStyle = 'italic';
    if (c.shadow) s.textShadow = c.shadow;
    if (c.align) s.textAlign = c.align;
    if (c.bg) s.background = c.bg;
    if (c.radius != null) s.borderRadius = u(c.radius);
    if (c.pad != null) s.padding = u(c.pad) + ' ' + u(c.pad * 1.6);
    if (c.border) s.border = u(.3) + ' solid ' + c.border;
    if (c.teks) e.textContent = c.teks;
    if (c.placeholder) { e.placeholder = c.placeholder; e.setAttribute('aria-label', c.placeholder); }
    (sc.cv || sc).appendChild(e);
    return e;
  }
  function mkScreen(bg, bleed){
    var sc = document.createElement('section'), cv = document.createElement('div');
    sc.className = 'scr'; sc.hidden = true; cv.className = 'cv'; sc.appendChild(cv); sc.cv = cv;
    sc.art = !!bg; sc.bleed = bg ? Math.max(0, +bleed || 0) : 0; // bleed = tambahan tinggi gambar di atas & bawah (px)
    if (bg) { sc.style.backgroundImage = 'url("' + bg + '")'; sc.style.backgroundColor = D.letterbox || '#0A1A3E'; }
    stage.appendChild(sc); screens.push(sc); return sc;
  }
  function show(s){ sF.hidden = s !== sF; sO.hidden = s !== sO; }

  var R = D.rsvp || {}, O = D.rsvpOk || {}, sF = mkScreen(R.bg, R.bleed), sO = mkScreen(O.bg, O.bleed);
  var SH = '0 1px 8px rgba(0,0,0,.55)';
  var FIELD = Object.assign({ bg: 'rgba(255,255,255,.95)', color: '#0A1A3E', border: '#F0D678', radius: 2.4, pad: 2.2, size: 4, weight: 500 }, R.field);
  var BTN = { size: 5, weight: 700, color: '#0A1A3E', bg: '#F0D678', radius: 3.2, pad: 2.4 };

  /* Layar 1: formulir */
  var eT = mk(sF, 'h1', { x: 50, y: 22, w: 84, size: 7, weight: 700, lineHeight: 1.1, shadow: SH }, R.judul);
  mk(sF, 'p', { x: 50, y: 29, w: 80, size: 3.6, weight: 500, color: '#F0D678', lineHeight: 1.35, shadow: SH, teks: 'Please fill out the form below to receive your invitation link' }, R.sub);
  var iN = mk(sF, 'input', Object.assign({}, FIELD, { x: 50, y: 42, w: 80, placeholder: 'Full Name' }), R.nama || {});
  var iD = mk(sF, 'input', Object.assign({}, FIELD, { x: 50, y: 50, w: 80, placeholder: 'Division' }), R.divisi || {});
  var iW = mk(sF, 'input', Object.assign({}, FIELD, { x: 50, y: 58, w: 80, placeholder: 'WhatsApp Number' }), R.wa || {});
  iN.type = 'text'; iN.maxLength = 80; iN.autocomplete = 'name';
  iD.type = 'text'; iD.maxLength = 80;
  iW.type = 'tel'; iW.inputMode = 'tel'; iW.autocomplete = 'tel';
  var bT = mk(sF, 'button', Object.assign({ x: 50, y: 69, w: 62, teks: 'Register' }, BTN), R.tombol || {}); bT.type = 'button';
  var eE = mk(sF, 'div', { x: 50, y: 76, w: 80, size: 3.4, weight: 500, color: '#ffb4b4', lineHeight: 1.3, shadow: SH }, R.pesan || {});
  mk(sF, 'div', { x: 50, y: 94, size: 3, weight: 500, color: 'rgba(255,255,255,.75)', shadow: SH, teks: 'The ticket is only valid for one person.' }, R.catatan);
  var autoT = eT && !eT.textContent; if (autoT) eT.textContent = demo ? 'Nama Event' : 'RSVP';
  var lbT = bT.textContent;

  /* Layar 2: berhasil + link undangan */
  mk(sO, 'h2', { x: 50, y: 30, w: 84, size: 7, weight: 700, lineHeight: 1.1, shadow: SH, teks: 'Thank you!' }, O.judul);
  var oM = mk(sO, 'p', { x: 50, y: 40, w: 80, size: 3.8, weight: 500, lineHeight: 1.4, color: 'rgba(255,255,255,.92)', shadow: SH }, O.pesan || {});
  var box = mk(sO, 'div', { x: 50, y: 52, w: 80, size: 3.4, weight: 500, color: '#F0D678', bg: 'rgba(0,0,0,.32)', radius: 2.4, pad: 2.4, lineHeight: 1.4 }, O.link || {});
  box.classList.add('box');
  var bl = document.createElement('small'), la = document.createElement('a');
  bl.textContent = 'Your invitation link'; la.target = '_blank'; la.rel = 'noopener'; box.append(bl, la);
  var bS = mk(sO, 'button', Object.assign({ x: 50, y: 64, w: 62, size: 4.4, teks: 'Copy Link' }, BTN, { bg: 'rgba(255,255,255,.16)', color: '#fff', border: '#F0D678' }), O.salin || {}); bS.type = 'button';
  var bW = mk(sO, 'a', Object.assign({ x: 50, y: 72, w: 62, size: 4.4, teks: 'Open WhatsApp' }, BTN, { bg: '#25D366', color: '#06281a' }), O.wa || {});
  bW.target = '_blank'; bW.rel = 'noopener';
  var lbS = bS.textContent;

  if (Q.get('grid') === '1') screens.forEach(function(sc){ var g = document.createElement('div'); g.className = 'grid'; sc.cv.appendChild(g); });

  /* Server */
  function api(a, args){
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: a, args: args || [] }) })
      .then(function(r){ return r.json(); })
      .then(function(j){ if (!j || !j.ok) throw new Error((j && j.error) || 'Gagal menghubungi server'); return j.data; });
  }
  function err(m){ eE.textContent = m || ''; }
  function loading(on){ bT.disabled = on; bT.textContent = on ? 'Sending…' : lbT; }
  function copy(t, done){
    function fb(){
      var ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fb); else fb();
  }
  function showOk(r){
    oM.textContent = r.waSent ? 'Your invitation link has been sent to WhatsApp ' + r.wa + '. Make sure to save that message!' : 'Registration is successful. Please save the invitation link below.';
    var has = /^https?:\/\//.test(r.linkTiket || '');
    box.hidden = bS.hidden = bW.hidden = !has;
    if (has) {
      la.href = r.linkTiket; la.textContent = r.linkTiket;
      bW.href = r.waFallback || ('https://wa.me/' + r.wa + '?text=' + encodeURIComponent('My invitation link: ' + r.linkTiket));
      bS.onclick = function(){ copy(r.linkTiket, function(){ bS.textContent = 'Copied ✓'; setTimeout(function(){ bS.textContent = lbS; }, 2000); }); };
    }
    show(sO);
    if (A.VIBRATE && navigator.vibrate) navigator.vibrate(A.VIBRATE);
  }

  bT.onclick = function(){
    err('');
    var n = iN.value.trim(), d = iD.value.trim(), w = iW.value.trim();
    if (n.length < 2) return err('Nama minimal 2 karakter.');
    if (!d) return err('Bagian/Divisi wajib diisi.');
    if (!w) return err('Nomor WhatsApp wajib diisi.');
    loading(true);
    api('rsvp', [n, d, w]).then(function(r){ loading(false); showOk(r); })
      .catch(function(e){ loading(false); err((e && e.message) || 'Terjadi kesalahan. Coba lagi.'); });
  };

  fit(); addEventListener('resize', fit); addEventListener('orientationchange', fit); addEventListener('load', fit); addEventListener('pageshow', fit);

  if (demo === 'ok') {
    showOk({ waSent: true, wa: '62812xxxxxxx', linkTiket: 'https://contoh.github.io/e-registration/ticket.html?t=ABC123' });
  } else {
    show(sF);
    if (!demo) api('rsvpinfo').then(function(i){
      if (!i) return;
      if (autoT) eT.textContent = i.event;
      document.title = i.event + ' · RSVP';
      if (!i.open) { err('Pendaftaran RSVP sudah ditutup.'); bT.disabled = true; bT.textContent = 'Pendaftaran Ditutup'; lbT = bT.textContent; }
    }).catch(function(){});
  }
}
function fail(e){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;padding:14px;border-radius:10px;background:#3b1010;color:#ffd0d0;font:14px/1.4 system-ui,sans-serif;z-index:99';
  d.textContent = 'Halaman RSVP gagal dimuat (' + ((e && e.message) || e) + '). Muat ulang halaman; jika tetap gagal, hubungi panitia.';
  document.body.appendChild(d);
}
try { boot(false); }
catch (e1) { try { console.error(e1); boot(true); } catch (e2) { fail(e2); } }
})();
</script>
</body>
</html>
