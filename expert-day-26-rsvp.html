<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP</title>
<style>
  :root{--bg:#0f172a;--card:#111c33;--line:#22304d;--txt:#e6edf7;--muted:#8fa3c0;
        --brand:#3b82f6;--ok:#10b981;--err:#ef4444;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
  .hd{text-align:center;margin:8px 0 20px}
  .hd h1{margin:0;font-size:22px}
  .hd p{margin:6px 0 0;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:#0b1425;color:var(--txt);font-size:16px;outline:none}
  input:focus{border-color:var(--brand)}
  button{margin-top:16px;width:100%;padding:14px;border:0;border-radius:10px;
    background:var(--brand);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button[disabled]{opacity:.6;cursor:not-allowed}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
  .msg.err{display:block;background:#3b1010;border:1px solid #6b1c1c;color:#ffbdbd}
  .ok{text-align:center}
  .ok h2{margin:4px 0 6px;font-size:20px}
  .ok p{margin:6px 0;color:var(--muted);font-size:14px}

  /* Kartu link undangan */
  .linkBox{margin:16px 0 6px;padding:12px;border-radius:10px;
    background:#0b1425;border:1px solid var(--line);text-align:left}
  .linkBox .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
  .linkBox a{display:block;word-break:break-all;color:#7fb3ff;font-size:14px;
    text-decoration:none;line-height:1.45}
  .linkBox a:hover{text-decoration:underline}

  .btn2{display:inline-block;margin-top:10px;padding:12px 16px;border-radius:10px;
    font-weight:700;text-decoration:none;font-size:15px;border:0;cursor:pointer}
  .btnCopy{background:#1e293b;color:#e6edf7;border:1px solid var(--line)}
  .btnWa{background:#25d366;color:#06281a;margin-left:8px}
  .copied{margin-top:8px;font-size:13px;color:var(--ok);display:none}
  .foot{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1 id="evName">RSVP</h1>
    <p>Isi data di bawah untuk menerima link undangan Anda.</p>
  </div>

  <div id="formCard" class="card">
    <label for="nama">Nama Lengkap</label>
    <input id="nama" type="text" autocomplete="name" placeholder="cth. Budi Santoso" maxlength="80">

    <label for="divisi">Bagian / Divisi</label>
    <input id="divisi" type="text" placeholder="cth. Finance" maxlength="80">

    <label for="wa">Nomor WhatsApp</label>
    <input id="wa" type="tel" inputmode="tel" autocomplete="tel" placeholder="cth. 0812xxxxxxx">

    <button id="btn" type="button">Daftar &amp; Kirim Link</button>
    <div id="err" class="msg err"></div>
  </div>

  <div id="okCard" class="card ok" style="display:none">
    <h2>✅ Terima kasih!</h2>
    <p id="okMsg"></p>

    <div class="linkBox" id="linkBox" style="display:none">
      <div class="lbl">Link Undangan Anda</div>
      <a id="linkA" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div id="actionRow" style="display:none">
      <button class="btn2 btnCopy" id="btnCopy" type="button">Salin Link</button>
      <a class="btn2 btnWa" id="waBtn" href="#" target="_blank" rel="noopener">Buka WhatsApp</a>
      <div class="copied" id="copied">Tersalin ✓</div>
    </div>
  </div>

  <div class="foot">Tiket hanya berlaku untuk satu orang.</div>
</div>

<script>
(function(){
  // GANTI dengan URL /exec hasil deploy Apps Script Anda (akhiri /exec)
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxgeoQMZzuhvBYeS4pcfnEX15s4pMLFN-QeXy3NcMQjUXO0ZakmOWjOByNd46WbhVxTSg/exec';

  var $ = function(id){ return document.getElementById(id); };
  var btn = $('btn'), errBox = $('err');

  function setErr(m){ errBox.textContent = m || ''; errBox.style.display = m ? 'block' : 'none'; }
  function loading(on){ btn.disabled = on; btn.textContent = on ? 'Mengirim…' : 'Daftar & Kirim Link'; }

  // POST ke Apps Script (text/plain supaya tidak kena preflight CORS)
  function callApi(action, args){
    return fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ a: action, args: args || [] })
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok) throw new Error((j && j.error) || 'Gagal menghubungi server');
      return j.data;
    });
  }

  // Info event + status pendaftaran
  callApi('rsvpinfo')
    .then(function(info){
      if (!info) return;
      $('evName').textContent = info.event;
      document.title = info.event + ' · RSVP';
      if (!info.open) {
        setErr('Pendaftaran RSVP sudah ditutup.');
        btn.disabled = true;
        btn.textContent = 'Pendaftaran Ditutup';
      }
    })
    .catch(function(){ /* diamkan, form tetap bisa dipakai */ });

  btn.addEventListener('click', function(){
    setErr('');
    var nama   = $('nama').value.trim();
    var divisi = $('divisi').value.trim();
    var wa     = $('wa').value.trim();

    if (nama.length < 2) return setErr('Nama minimal 2 karakter.');
    if (!divisi)         return setErr('Bagian/Divisi wajib diisi.');
    if (!wa)             return setErr('Nomor WhatsApp wajib diisi.');

    loading(true);
    callApi('rsvp', [nama, divisi, wa])
      .then(function(res){ loading(false); showOk(res); })
      .catch(function(e){ loading(false); setErr((e && e.message) || 'Terjadi kesalahan. Coba lagi.'); });
  });

  function showOk(r){
    $('formCard').style.display = 'none';
    $('okCard').style.display = 'block';

    if (r.waSent) {
      $('okMsg').textContent = 'Link undangan sudah dikirim ke WhatsApp ' + r.wa + '. Simpan pesan itu, ya!';
    } else {
      $('okMsg').textContent = 'Pendaftaran berhasil. Simpan link undangan di bawah ini.';
    }

    // Link undangan
    if (r.linkTiket) {
      var a = $('linkA');
      a.href = r.linkTiket;
      a.textContent = r.linkTiket;
      $('linkBox').style.display = 'block';
      $('actionRow').style.display = 'block';

      // Tombol "Buka WhatsApp": kirim link ke diri sendiri / provider fallback
      var w = $('waBtn');
      w.href = r.waFallback || ('https://wa.me/' + r.wa + '?text=' + encodeURIComponent('Link undangan saya: ' + r.linkTiket));

      // Tombol salin
      $('btnCopy').onclick = function(){
        var txt = r.linkTiket;
        var done = function(){
          var c = $('copied');
          c.style.display = 'block';
          setTimeout(function(){ c.style.display = 'none'; }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
        } else {
          fallbackCopy(txt, done);
        }
      };
    }
  }

  function fallbackCopy(txt, cb){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb && cb(); } catch (e) { /* diamkan */ }
    document.body.removeChild(ta);
  }
})();
</script>
</body>
</html>
