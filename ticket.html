<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>E-Tiket</title>
<style>
:root{--bg:#f6f7f9;--tx:#1a1d23;--mu:#6b7280;--ok:#16a34a;--er:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--tx:#eceef2;--mu:#9aa1ad}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .4s}
body.ok{background:var(--ok);color:#fff}
.s{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center}
.ev{color:var(--mu);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
h1{font-size:28px;margin:2px 0 0;line-height:1.2}
h2{font-size:26px;margin:10px 0 0;line-height:1.2}
.dv{color:var(--mu);font-size:18px}
.hint{color:var(--mu);font-size:14px;max-width:320px}
#qr{width:230px;border-radius:16px;overflow:hidden;margin:18px 0 6px;line-height:0}
.tok{font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mu);font-size:15px}
.tick{width:104px;height:104px;border-radius:50%;background:#fff;color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:700;margin-bottom:12px}
body.ok .dv,body.ok .hint{color:rgba(255,255,255,.92)}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--mu);border-radius:10px;padding:8px 14px;margin-top:10px;cursor:pointer}
#net{position:fixed;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:var(--mu);z-index:5}
/* tampilan desain: kanvas dengan rasio desain Anda, semua posisi dalam persen */
.d{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#000}
.st{position:relative;overflow:hidden;aspect-ratio:var(--r);width:min(100vw,calc(100vh*var(--r)));width:min(100vw,calc(100dvh*var(--r)))}
.st .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.el{position:absolute;line-height:1.15;overflow-wrap:anywhere}
#dqr{border-radius:calc(var(--u)*2.5);overflow:hidden;line-height:0}
.grid .st::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(255,0,80,.6) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,0,80,.6) 1px,transparent 1px);background-size:10% 10%}
@keyframes fl{0%{opacity:0}25%{opacity:.85}100%{opacity:0}}
#flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:30}
#flash.go{animation:fl .7s ease-out}
#gate,#dcover{position:fixed;inset:0;z-index:20;transition:opacity .45s ease,transform .45s ease}
#gate.open,#dcover.open{opacity:0;transform:scale(1.04);pointer-events:none}
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px;text-align:center;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#16306e 0%,#0a1a3e 60%,#07122e 100%)}
#gate .seal{width:96px;height:96px;border-radius:50%;border:3px solid #d4af37;display:flex;align-items:center;justify-content:center;font-size:42px;margin-bottom:8px;box-shadow:0 0 40px rgba(212,175,55,.35)}
#gate .gev{color:#f0d678;letter-spacing:.2em;font-size:13px;text-transform:uppercase}
#gate .gs{color:rgba(255,255,255,.78);font-size:15px;margin-top:14px}
#gate b{font-size:30px;line-height:1.2;max-width:90%;overflow-wrap:anywhere}
#gate .gd{color:#f0d678;font-size:18px}
.cbtn{font-family:inherit;font-weight:700;border:0;cursor:pointer;white-space:nowrap;animation:pulse 2s ease-in-out infinite}
#gb{margin-top:26px;padding:15px 36px;border-radius:999px;background:#f0d678;color:#0a1a3e;font-size:18px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,214,120,.55)}50%{box-shadow:0 0 0 16px rgba(240,214,120,0)}}
[hidden]{display:none!important}
</style></head><body>

<section id="load" class="s"><div class="hint">Memuat tiket…</div></section>

<section id="pend" class="s" hidden>
  <div class="ev" id="ev1"></div>
  <h1 id="n1"></h1>
  <div class="dv" id="d1"></div>
  <div id="qr"></div>
  <div class="tok" id="tk"></div>
  <div class="hint">Tunjukkan QR ini ke petugas di pintu masuk. Layar akan berubah otomatis setelah QR discan. Naikkan kecerahan layar agar mudah dipindai.</div>
  <button id="rf">Perbarui status</button>
</section>

<section id="ok" class="s" hidden>
  <div class="tick">✓</div>
  <h1>Berhasil Check-in</h1>
  <h2 id="n2"></h2>
  <div class="dv" id="d2"></div>
  <div class="dv" id="w2"></div>
  <div class="hint" id="ev2"></div>
</section>

<section id="err" class="s" hidden>
  <h1>Tiket tidak ditemukan</h1>
  <div class="hint">Periksa kembali link tiket Anda, atau hubungi panitia di lokasi.</div>
</section>

<!-- tampilan memakai desain Anda (aktif bila config.js memuat gambar desain) -->
<section id="dpend" class="d" hidden><div class="st">
  <img class="bg" alt="">
  <div class="el" id="dn"></div><div class="el" id="dd"></div><div class="el" id="dqr"></div><div class="el" id="dt"></div>
</div></section>

<section id="dok" class="d" hidden><div class="st">
  <img class="bg" alt="">
  <div class="el" id="sn"></div><div class="el" id="sd"></div><div class="el" id="sw"></div>
</div></section>

<!-- sampul "Buka Undangan": satu ketukan yang terasa wajar (dan membuka izin getar) -->
<section id="gate" hidden>
  <div class="seal">✉</div>
  <div class="gev" id="gev"></div>
  <div class="gs" id="gsalam"></div>
  <b id="gn"></b>
  <div class="gd" id="gdv"></div>
  <div class="gs" id="gajak"></div>
  <button class="cbtn" id="gb"></button>
</section>
<section id="dcover" class="d" hidden><div class="st">
  <img class="bg" alt="">
  <div class="el" id="cn"></div><div class="el" id="cd"></div><button class="el cbtn" id="cb"></button>
</div></section>

<div id="flash"></div>
<div id="net"></div>

<script>
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const API_URL = String((window.APP && window.APP.API_URL) || '');
const DES = (window.APP && window.APP.DESIGN) || null;
let token = '', timer = null, done = false, busy = false, qrDone = false, cur = 'load';
const useD = k => !!(DES && DES[k] && DES[k].bg);

/* Getar saat berhasil check-in. Pola bisa diatur di config.js (VIBRATE: [getar, jeda, getar, ...] dalam milidetik; false = mati).
   ATURAN BROWSER (tidak bisa dilewati lewat kode): Chrome/Android memblokir getar sampai layar diketuk sekali.
   Caranya dibuat wajar: tiket tersembunyi di balik sampul "Buka Undangan" (seperti undangan digital pada umumnya).
   Untuk melihat QR-nya tamu pasti mengetuk, dan ketukan itulah yang membuka izin getar. Tidak ada tulisan "ketuk agar bergetar".
   Ketukan baru dianggap sah bila browser benar-benar mencatatnya (navigator.userActivation); gesekan/scroll tidak dihitung.
   iPhone (Safari) tidak mengizinkan web memicu getar sama sekali: di sana dipakai kilatan layar + bunyi singkat.
   Config: COVER:false (tanpa sampul) | COVER_TEKS:{salam,ajakan,tombol} | SOUND:'auto'|true|false | VIBRATE */
const VIB = (window.APP && 'VIBRATE' in window.APP) ? window.APP.VIBRATE : [300, 120, 300, 120, 600];
const SND = (window.APP && 'SOUND' in window.APP) ? window.APP.SOUND : 'auto';
const COVER = !(window.APP && (window.APP.COVER === false || window.APP.GATE === false));
const TXT = Object.assign({ salam: 'Kepada Yth.', ajakan: 'Anda diundang secara khusus', tombol: 'Buka Undangan' }, (window.APP && window.APP.COVER_TEKS) || {});
const canVib = !!(VIB && navigator.vibrate);
const useSound = SND === true || (SND === 'auto' && !canVib);
let armed = false, actx = null, wl = null, coverShown = false, forceCover = false, simAfterArm = false, demoData = null;
function wake() { // layar tetap menyala selama menunggu (layar mati = getar & pengecekan terhenti)
  try { if (navigator.wakeLock && !done && !document.hidden) navigator.wakeLock.request('screen').then(x => { wl = x; }).catch(() => {}); } catch (e) {}
}
function closeCover() {
  ['#gate', '#dcover'].forEach(id => {
    const el = $(id); if (el.hidden) return;
    el.classList.add('open'); // memudar & membesar sedikit: ketukan terasa "membuka" undangan
    setTimeout(() => { el.hidden = true; el.classList.remove('open'); }, 450);
  });
}
function showCover(r) {
  if (!COVER || armed || coverShown || !(forceCover || canVib || useSound)) return;
  coverShown = true;
  $('#gev').textContent = r.event || ''; $('#gsalam').textContent = TXT.salam; $('#gn').textContent = r.nama;
  $('#gdv').textContent = r.divisi || ''; $('#gajak').textContent = TXT.ajakan; $('#gb').textContent = TXT.tombol;
  $('#cn').textContent = r.nama; $('#cd').textContent = r.divisi || ''; $('#cb').textContent = TXT.tombol;
  const d = useD('cover');
  $(d ? '#dcover' : '#gate').hidden = false;
  if (d) fit();
}
function arm() { // dipanggil pada sentuhan; hanya jadi "aktif" bila browser sudah mencatatnya
  if (armed) return;
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  armed = true;
  const opening = coverShown;
  closeCover();
  try { if (canVib) navigator.vibrate(opening ? 35 : 1); } catch (e) {} // denyut singkat = umpan balik "klik" saat membuka
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC && useSound) { actx = new AC(); if (actx.resume) actx.resume(); } } catch (e) {}
  wake();
  if (simAfterArm) { simAfterArm = false; setTimeout(() => render({ ...demoData, hadir: true }), 5000); }
}
// hanya event yang BENAR-BENAR dihitung browser sebagai sentuhan pengguna (touchstart/pointerdown tidak cukup)
['pointerup', 'touchend', 'mousedown', 'click', 'keydown'].forEach(ev => addEventListener(ev, arm, { passive: true }));
function chime() {
  if (!actx || !useSound) return;
  try {
    const t = actx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), a = t + i * 0.15;
      o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, a); g.gain.exponentialRampToValueAtTime(0.25, a + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a + 0.17);
      o.start(a); o.stop(a + 0.2);
    });
  } catch (e) {}
}
function celebrate() { // dipanggil SEKALI, tepat saat status berubah dari "menunggu" menjadi "berhasil"
  try { if (canVib) navigator.vibrate(VIB); } catch (e) {}
  chime();
  document.title = '✓ Berhasil check-in';
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}

/* ---------- QR: digambar sebagai SVG, tajam di ukuran berapa pun, zona tenang 4 modul sudah termasuk ---------- */
function qrSvg(text) {
  const q = new QRCode(document.createElement('div'), { text: text, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.Q });
  const m = q._oQRCode, n = m.getModuleCount(), z = 4;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m.isDark(r, c)) d += 'M' + (c + z) + ' ' + (r + z) + 'h1v1h-1z';
  const v = n + 2 * z;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + v + ' ' + v + '" shape-rendering="crispEdges" style="display:block;width:100%;height:auto">' +
    '<rect width="' + v + '" height="' + v + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

/* ---------- desain ---------- */
const fs = n => 'calc(var(--u) * ' + n + ')';
function place(el, c) {
  el._c = c;
  el.style.left = c.x + '%'; el.style.top = c.y + '%';
  if (c.w) el.style.width = c.w + '%';
  el.style.fontSize = fs(c.size || 4);
  el.style.fontWeight = c.weight || 700;
  el.style.color = c.color || DES.color || '#fff';
  if (c.font) el.style.fontFamily = c.font;                                   // font khusus elemen ini
  if (c.letterSpacing != null) el.style.letterSpacing = fs(c.letterSpacing);  // jarak antar huruf
  if (c.uppercase) el.style.textTransform = 'uppercase';
  if (c.italic) el.style.fontStyle = 'italic';
  if (c.lineHeight) el.style.lineHeight = c.lineHeight;
  if (c.shadow) el.style.textShadow = c.shadow === true ? '0 2px 12px rgba(0,0,0,.45)' : c.shadow;
  if (c.bg) el.style.background = c.bg;                                         // latar (untuk tombol)
  if (c.radius != null) el.style.borderRadius = fs(c.radius);                   // sudut membulat
  if (c.pad != null) el.style.padding = fs(c.pad) + ' ' + (c.w ? '0' : fs(c.pad * 2));
  const a = c.align || 'center';
  el.style.textAlign = a;
  el.style.transform = a === 'left' ? 'translate(0,-50%)' : a === 'right' ? 'translate(-100%,-50%)' : 'translate(-50%,-50%)';
}
function setup(sec, key, map) {
  if (!useD(key)) return;
  const cfg = DES[key], s = $(sec), st = s.querySelector('.st');
  st.style.setProperty('--r', (DES.width || 1080) / (DES.height || 1920));
  const img = s.querySelector('.bg');
  img.onerror = () => { cfg.bg = ''; $('#net').textContent = 'Gambar desain tidak ditemukan: ' + img.getAttribute('src'); view(cur); if (sec === '#dcover' && !$('#dcover').hidden) { $('#dcover').hidden = true; if (!armed) $('#gate').hidden = false; } };
  img.src = cfg.bg;
  if (DES.letterbox) s.style.background = DES.letterbox;
  for (const id in map) { if (cfg[map[id]]) place($(id), cfg[map[id]]); else $(id).hidden = true; }
}
// Ukuran otomatis: bila 'h' (tinggi kotak, % tinggi desain) diisi, huruf dikecilkan sampai teks muat (batas bawah 'min')
function shrink(el) {
  const c = el._c;
  if (!c || !c.h) return;
  const maxH = el.closest('.st').clientHeight * c.h / 100;
  if (!maxH) return;
  let n = c.size || 4; const lo = c.min || n * 0.5;
  el.style.fontSize = fs(n);
  while (el.scrollHeight > maxH + 1 && n > lo) { n = Math.max(lo, n - 0.25); el.style.fontSize = fs(n); }
}
const fit = () => document.querySelectorAll('.st').forEach(st => {
  st.style.setProperty('--u', (st.clientWidth / 100) + 'px');
  st.querySelectorAll('.el').forEach(shrink);
});
addEventListener('resize', fit);
if (DES && DES.font) document.body.style.fontFamily = DES.font;
if (DES && DES.fontUrl) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = DES.fontUrl; document.head.appendChild(l); }
setup('#dpend', 'ticket', { '#dn': 'nama', '#dd': 'divisi', '#dqr': 'qr', '#dt': 'token' });
setup('#dok', 'success', { '#sn': 'nama', '#sd': 'divisi', '#sw': 'waktu' });
setup('#dcover', 'cover', { '#cn': 'nama', '#cd': 'divisi', '#cb': 'tombol' });

/* ---------- data ---------- */
const ask = () => fetch(API_URL, {
  method: 'POST',
  headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // tanpa preflight CORS
  body: JSON.stringify({ a: 'guest', args: [token] })
}).then(r => r.text()).then(x => {
  let j; try { j = JSON.parse(x); } catch (e) { throw new Error('Respons server tidak valid'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
});

function view(id) {
  cur = id;
  const t = id === 'pend' && useD('ticket') ? 'dpend' : id === 'ok' && useD('success') ? 'dok' : id;
  ['load', 'pend', 'ok', 'err', 'dpend', 'dok'].forEach(x => { $('#' + x).hidden = x !== t; });
  document.body.className = t === 'ok' ? 'ok' : ''; // hijau polos hanya untuk tampilan tanpa desain
  if (t === 'dpend' || t === 'dok') fit();
}

function render(r) {
  if (!r || !r.found) { done = true; clearTimeout(timer); view('err'); return; }
  if (r.hadir) {
    done = true; clearTimeout(timer);
    const w = r.waktu ? 'Pukul ' + r.waktu : '';
    $('#n2').textContent = r.nama; $('#d2').textContent = r.divisi; $('#w2').textContent = w;
    $('#ev2').textContent = 'Selamat datang di ' + r.event;
    $('#sn').textContent = r.nama; $('#sd').textContent = r.divisi; $('#sw').textContent = w;
    const live = cur === 'pend'; // true = tamu sedang menunggu lalu petugas men-scan
    view('ok'); $('#gate').hidden = true; $('#dcover').hidden = true;
    if (live) celebrate();
    try { if (wl) wl.release(); } catch (e) {}
    return;
  }
  $('#ev1').textContent = r.event; $('#n1').textContent = r.nama; $('#d1').textContent = r.divisi; $('#tk').textContent = token;
  $('#dn').textContent = r.nama; $('#dd').textContent = r.divisi; $('#dt').textContent = token;
  if (!qrDone) { // dibuat di perangkat ini, untuk kedua tampilan agar cadangan polos tetap lengkap
    const svg = qrSvg(r.qr || r.scanUrl);
    $('#qr').innerHTML = svg; $('#dqr').innerHTML = svg;
    qrDone = true;
  }
  view('pend');
  showCover(r); // sampul "Buka Undangan" menutup tiket sampai tamu mengetuk
}

const T0 = Date.now();
let lastMs = 0;
function next() {
  clearTimeout(timer);
  // cepat (±2,5 dtk) saat tiket baru dibuka di pintu masuk, hemat (±6 dtk) setelah 5 menit, dan melambat sendiri bila server lambat
  if (!done) timer = setTimeout(tick, Math.min(12000, Math.max(Date.now() - T0 < 300000 ? 2500 : 6000, lastMs * 3)) + Math.random() * 600);
}

async function tick() {
  if (done) return;
  if (document.hidden) { next(); return; }   // hemat kuota saat layar mati / tab di belakang
  if (busy) return;
  busy = true;
  const t1 = Date.now();
  try { render(await ask()); lastMs = Date.now() - t1; if (!/desain/.test($('#net').textContent)) $('#net').textContent = ''; }
  catch (e) { $('#net').textContent = 'Koneksi bermasalah, mencoba lagi…'; }
  finally { busy = false; next(); }
}

$('#rf').onclick = () => { clearTimeout(timer); tick(); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden || done) return;
  clearTimeout(timer); tick(); wake();
});
addEventListener('focus', () => { if (!done) { clearTimeout(timer); tick(); } });
addEventListener('pageshow', e => { if (e.persisted && !done) { clearTimeout(timer); tick(); } });
wake();

/* ---------- mulai ---------- */
const demo = P.get('demo'); // pratinjau desain tanpa token: ?demo=pend atau ?demo=ok (tambah &grid=1 untuk garis bantu 10%)
if (demo) {
  if (P.get('grid')) document.documentElement.classList.add('grid');
  token = 'DEMO2345'; done = true;
  forceCover = demo === 'cover'; if (demo !== 'cover') coverShown = true; // ?demo=cover memperlihatkan sampul; mode lain tanpa sampul
  demoData = { found: true, nama: P.get('nama') || 'Budi Santoso', divisi: P.get('divisi') || 'PT Maju Jaya',
    hadir: demo === 'ok', waktu: '09:41', event: 'Nama Acara', qr: 'DEMO2345' };
  render(demoData);
  // ?demo=cover&sim=1 : sampul -> ketuk -> 5 detik kemudian layar berubah ke "berhasil" seperti saat petugas men-scan (uji getar di HP)
  if (P.get('sim')) simAfterArm = true; // mulai hitung 5 detik SETELAH ketukan pertama, supaya getar bisa diuji
} else if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)) {
  view('err'); $('#net').textContent = 'Alamat server belum diatur (config.js).';
} else {
  token = String(P.get('g') || '').trim().toUpperCase();
  if (!token) view('err'); else tick();
}
</script></body></html>
